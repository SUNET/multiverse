---
- name: Build CMDB from ops repo
  ansible.builtin.stat:
    path: "{{ repo_root }}/{{ item.key }}"
  loop: "{{ servers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: openstack_server_host_dirs

- name: Warn about servers missing from ops repo
  ansible.builtin.set_fact:
    openstack_server_skip_warning: "{{ ('skipping ' ~ item ~ ' — no host directory (run ./addhost ' ~ item ~ ')') | warn }}"
  loop: "{{ openstack_server_host_dirs.results | rejectattr('stat.exists') | map(attribute='item.key') | list }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false

- name: Collect servers that are present in the ops repo
  ansible.builtin.set_fact:
    openstack_server_hosts: "{{ openstack_server_host_dirs.results | selectattr('stat.exists') | map(attribute='item') | list }}"

- name: Set repo variables
  ansible.builtin.set_fact:
    openstack_server_cosmos_repo: "{{ lookup('ansible.builtin.file', repo_root ~ '/cosmos.conf') | regex_search('repo=\"?([^\"\\s]+)\"?', '\\1') | first }}"
    openstack_server_cosmos_tag: "{{ lookup('ansible.builtin.file', repo_root ~ '/cosmos.conf') | regex_search('tag=\"?([^\"\\s]+)\"?', '\\1') | first }}"

- name: Create or update the port of every server whose port is independent of it
  vars:
    security_group_names: "{{ item.value.security_groups | map('regex_replace', '^', 'maestro-' ~ security_group_name_prefix ~ '-') | list }}"
  openstack.cloud.port:
    name: "{{ item.key }}"
    state: present
    cloud: "{{ item.value.cloud }}"
    network: "{{ item.value.network }}"
    security_groups: "{{ security_group_names }}"
  loop: "{{ openstack_server_hosts }}"
  loop_control:
    label: "{{ item.key }}"
  # Runs on every pass, so adding or removing a security group in servers.yml
  # reaches the running instance. Servers flagged independent_port: false are
  # skipped: the port Nova made for them has no name to address it by, and
  # creating one here would leave an unattached port holding a routable address.
  # The flag records how an instance was built, so switching it on an existing
  # server needs a rebuild — editing it alone just creates that stray port.
  when: item.value.independent_port | default(true) | bool

# Snapshot taken before the launch task, so "did this run create the instance?"
# is a question about the cloud's own state. openstack.cloud.server reports
# `changed` for any update it applies to an *existing* instance -- security
# groups, tags, metadata, floating IPs -- so its change state cannot stand in
# for creation. One call per cloud, not per host.
- name: List the instances that already exist in each cloud
  openstack.cloud.server_info:
    cloud: "{{ item }}"
  loop: "{{ openstack_server_hosts | map(attribute='value.cloud') | unique | list }}"
  register: openstack_server_existing_info
  changed_when: false

- name: Record which instances existed before this run
  ansible.builtin.set_fact:
    openstack_server_pre_existing: >-
      {{ openstack_server_existing_info.results
      | map(attribute='servers')
      | flatten
      | map(attribute='name')
      | list }}

- name: Launch and bootstrap an instance
  vars:
    bootstrap: /root/cosmos-init/apt/bootstrap-cosmos.sh
    log: /root/cloud-init-bootstrap-cosmos.log
    bash: /usr/bin/bash
    security_group_names: "{{ item.value.security_groups | map('regex_replace', '^', 'maestro-' ~ security_group_name_prefix ~ '-') | list }}"
    independent_port: "{{ item.value.independent_port | default(true) | bool }}"
  openstack.cloud.server:
    auto_ip: false
    name: "{{ item.key }}"
    state: present
    cloud: "{{ item.value.cloud }}"
    flavor: "{{ item.value.flavor }}"
    image: "{{ item.value.image }}"
    key_name: "{{ item.value.key_name }}"
    network: "{{ omit if independent_port else item.value.network }}"
    nics: "{{ [{'port-name': item.key}] if independent_port else omit }}"
    # The groups live on the port we created; Nova cannot set them on a boot
    # that supplies a pre-created port.
    security_groups: "{{ omit if independent_port else security_group_names }}"
    timeout: 200
    boot_from_volume: true
    terminate_volume: true
    volume_size: "{{ item.value.volume_size }}"
    userdata: |
      #cloud-config
      hostname: {{ item.key }}
      disable_root: false

      system_info:
        default_user:
          name: root
      packages:
        - git
      # Note, that the list has to be proper yaml, so you have to quote
      # any characters yaml would eat (':' can be problematic)
      runcmd:
       # Note: Don't write files to /tmp from cloud-init use /run/somedir instead.
       # Early boot environments can race systemd-tmpfiles-clean LP: #1707222.
       - [ mkdir, /root/cosmos-init ]
       - [ git, clone, "{{ openstack_server_cosmos_repo }}", /root/cosmos-init ]
       - [ /root/cosmos-init/iaas-setup.sh, "-s" ]
       - [ {{ bash }}, -xc, "cosmos_deb=$(find /root/cosmos-init/apt/ -maxdepth 1 -name 'cosmos_*.deb' | sort -V | tail -1) && cp -v $cosmos_deb /root"   ]
       - [ {{ bash }}, -c, "echo running bootstrap-cosmos.sh from cloud-init, log at /root/cloud-init-bootstrap-cosmos.log" ]
       - [ {{ bash }}, -xc, "cd /root && {{ bootstrap }} {{ item.key }} {{ openstack_server_cosmos_repo }} {{ openstack_server_cosmos_tag }} > {{ log }} 2>&1" ]
       - [ {{ bash }}, -c, "echo bootstrap-cosmos.sh exited, see /root/cloud-init-bootstrap-cosmos.log for details" ]
  loop: "{{ openstack_server_hosts }}"
  register: openstack_server_returnvals
  loop_control:
    label: "{{ item.key }}"

- name: Get zones managed by knotctl
  ansible.builtin.command:
    cmd: knotctl --json user
  register: openstack_server_knotctl_user
  changed_when: false
  # DNS is a post-provisioning step. A missing or misconfigured knotctl must
  # not fail a run whose instances came up fine; warn below instead. README
  # lists knotctl as optional, so "not installed" is a supported state.
  failed_when: false

- name: Warn when knotctl is unavailable
  vars:
    # Real newlines come from this literal block scalar. '\n' inside a Jinja
    # string literal is not an escape here -- it reaches the operator as a
    # literal backslash-n, the same trap as the regex note further down.
    message: |-
      knotctl is unavailable (rc={{ openstack_server_knotctl_user.rc | default('n/a') }}), so DNS records
      were NOT created for any new instance. Update DNS manually.

      {{ openstack_server_knotctl_user.stderr | default(openstack_server_knotctl_user.msg | default('(no error output)')) }}
  ansible.builtin.set_fact:
    openstack_server_knotctl_warning: "{{ message | warn }}"
  when: (openstack_server_knotctl_user.rc | default(-1)) != 0
  changed_when: false

- name: Default to no knotctl-managed zones
  ansible.builtin.set_fact:
    openstack_server_knotctl_zones: []

- name: Collect knotctl-managed zones (without trailing dot)
  ansible.builtin.set_fact:
    openstack_server_knotctl_zones: "{{ (openstack_server_knotctl_user.stdout | from_json).zones | map('regex_replace', '\\.$', '') | list }}"
  when: (openstack_server_knotctl_user.rc | default(-1)) == 0

- name: Resolve the knotctl-managed zone of each server
  ansible.builtin.set_fact:
    openstack_server_zone_map: "{{ openstack_server_zone_map | default({}) | combine({item.key: zone}) }}"
  loop: "{{ openstack_server_hosts }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    # knotctl-managed zones that are a label-aligned suffix of the host name.
    # Match dots as [.] — a block scalar passes backslashes through unescaped,
    # so '\\.' would reach the regex as a literal backslash and match nothing.
    matched_zones: >-
      {{ openstack_server_knotctl_zones
      | map('regex_replace', '^', '.')
      | select('in', '.' ~ item.key)
      | map('regex_replace', '^[.]', '')
      | list }}
    # most specific (longest) match is the host's zone
    zone: "{{ (matched_zones | select('match', '^.{' ~ (matched_zones | map('length') | list | max) ~ '}$') | first) if matched_zones | length > 0 else '' }}"
  changed_when: false

# knotctl's output cannot say whether the sync wrote anything, so the records
# are read before and after it and compared. Same loop and same `when` as the
# sync below, so the three result lists line up index for index.
- name: Read the DNS records of each created server before syncing
  ansible.builtin.command:
    cmd: >-
      knotctl --json list
      -n {{ item.item.key }}
      -z {{ openstack_server_zone_map[item.item.key] }}
  loop: "{{ openstack_server_returnvals.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.item.key not in openstack_server_pre_existing
    - openstack_server_zone_map[item.item.key] | length > 0
  register: openstack_server_dns_before
  changed_when: false
  failed_when: false

- name: Sync DNS records for created servers if zone is managed by knotctl
  ansible.builtin.command:
    cmd: >-
      knotctl openstack-sync
      -n {{ item.item.key }}
      -c {{ item.item.value.cloud }}
      -z {{ openstack_server_zone_map[item.item.key] }}
  loop: "{{ openstack_server_returnvals.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.item.key not in openstack_server_pre_existing
    - openstack_server_zone_map[item.item.key] | length > 0
  register: openstack_server_dns_sync
  # A sync error leaves a reachable instance without a DNS record. That is
  # worth a loud warning, not a failed run: the VM is already up, and failing
  # here makes an infrastructure problem indistinguishable from a DNS one.
  failed_when: false
  # No change state from this task, because knotctl's output cannot carry one.
  # openstack-sync prints via add()/update()/delete(), one line per record --
  # but add() prints only when the API's PUT reply contains the record it just
  # wrote, and the knot REST API answers a write with the zone's new SOA. So a
  # successful create prints nothing, exactly like a no-op: both are empty
  # stdout with rc 0. "Report the DNS records" below gets the change state from
  # the records themselves instead.
  #
  # stdout is still worth reading for failures, which is the one thing knotctl
  # does say clearly: an error payload (it exits 0 for a connection or decode
  # failure) or a non-zero rc. See "Warn about DNS sync failures".
  changed_when: false

- name: Warn when DNS was not synced for a created server (no knotctl-managed zone)
  vars:
    addresses: "{{ item.item.server.addresses[item.item.item.value.network] | default([]) | map(attribute='addr') | join(', ') }}"
    message: |-
      {{ item.item.item.key }} got a new IP but DNS was NOT synced: no knotctl-managed
      zone matches it. Update DNS manually.

      {{ addresses }}
  ansible.builtin.set_fact:
    openstack_server_dns_zone_warning: "{{ message | warn }}"
  loop: "{{ openstack_server_dns_sync.results }}"
  loop_control:
    label: "{{ item.item.item.key }}"
  when:
    - item.skipped | default(false)
    - item.item.item.key not in openstack_server_pre_existing
  changed_when: false

- name: Warn about DNS sync failures
  vars:
    message: |-
      DNS sync failed for {{ item.item.item.key }} (rc={{ item.rc | default('n/a') }}). Update DNS manually.

      stdout: {{ item.stdout | default('') | trim | default('(none)', true) }}
      stderr: {{ item.stderr | default('') | trim | default('(none)', true) }}
  ansible.builtin.set_fact:
    openstack_server_dns_warning: "{{ message | warn }}"
  loop: "{{ openstack_server_dns_sync.results }}"
  loop_control:
    label: "{{ item.item.item.key }}"
  # Two failure shapes, neither of which rc alone catches. knotctl exits 0 on
  # a connection or decode error and puts the error payload on stdout, and it
  # exits non-zero for "Server not found" with the message on stdout too --
  # so both streams are reported and stdout is part of the test.
  when:
    - not (item.skipped | default(false))
    - (item.rc | default(-1)) != 0 or 'Error:' in (item.stdout | default(''))
  changed_when: false

- name: Read the DNS records of each created server after syncing
  ansible.builtin.command:
    cmd: >-
      knotctl --json list
      -n {{ item.item.key }}
      -z {{ openstack_server_zone_map[item.item.key] }}
  loop: "{{ openstack_server_returnvals.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.item.key not in openstack_server_pre_existing
    - openstack_server_zone_map[item.item.key] | length > 0
  register: openstack_server_dns_after
  changed_when: false
  failed_when: false

- name: Report the DNS records of each created server
  vars:
    # A name with no records answers {"Code": 404, ...} rather than an array,
    # so stdout is only parsed when it actually starts with '['.
    before_out: "{{ (openstack_server_dns_before.results[idx].stdout | default('') | trim) or '[]' }}"
    after_out: "{{ (item.stdout | default('') | trim) or '[]' }}"
    # Address records only: the zone's SOA serial changes on every write and
    # would otherwise read as a change to this host.
    before: "{{ ((before_out | from_json) if (before_out | first) == '[' else []) | selectattr('rtype', 'in', ['A', 'AAAA']) | map(attribute='data') | map('lower') | sort | list }}"
    after: "{{ ((after_out | from_json) if (after_out | first) == '[' else []) | selectattr('rtype', 'in', ['A', 'AAAA']) | map(attribute='data') | map('lower') | sort | list }}"
    added: "{{ after | reject('in', before) | list }}"
  ansible.builtin.debug:
    msg: >-
      {{ item.item.item.key }}:
      {{ ('DNS now ' ~ (after | join(', ')) ~ ((' (added ' ~ (added | join(', ')) ~ ')') if added | length > 0 else ''))
      if after | length > 0 else 'still has no DNS records' }}
  loop: "{{ openstack_server_dns_after.results }}"
  loop_control:
    index_var: idx
    label: "{{ item.item.item.key }}"
  when: not (item.skipped | default(false))
  # The one honest change signal available: the records are different now than
  # they were before the sync ran.
  changed_when: before != after

- name: Warn when DNS does not match the addresses the instance has
  vars:
    after_out: "{{ (item.stdout | default('') | trim) or '[]' }}"
    published: "{{ ((after_out | from_json) if (after_out | first) == '[' else []) | selectattr('rtype', 'in', ['A', 'AAAA']) | map(attribute='data') | map('lower') | list }}"
    expected: "{{ item.item.server.addresses[item.item.item.value.network] | default([]) | map(attribute='addr') | map('lower') | list }}"
    missing: "{{ expected | reject('in', published) | list }}"
    message: |-
      {{ item.item.item.key }} has addresses with no DNS record after the sync. Update DNS manually.

      missing:   {{ missing | join(', ') }}
      published: {{ published | join(', ') | default('(none)', true) }}
  ansible.builtin.set_fact:
    openstack_server_dns_mismatch_warning: "{{ message | warn }}"
  loop: "{{ openstack_server_dns_after.results }}"
  loop_control:
    label: "{{ item.item.item.key }}"
  when:
    - not (item.skipped | default(false))
    - missing | length > 0
  changed_when: false
